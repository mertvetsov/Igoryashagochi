; Прошивка Игоряшгочи для GeekMagic SmallTV-PRO: ESP32, 8 МБ флеша, ST7789 240×240.
;
; Пины, SPI mode 3 и таблица разделов — из smalltv-mod (github.com/giovi321/smalltv-mod),
; проверены на железе. Разделы совпадают со стоком: два OTA-слота по 2.125 МБ и
; 3.7 МБ файлов, поэтому firmware.bin заливается через стоковый /update, а сток
; остаётся во втором слоте — к нему можно вернуться кнопкой на странице.
;
; Сборка:  ../.venv/bin/pio run          →  .pio/build/smalltv_pro/firmware.bin
; Картинки src/assets.h собираются перед сборкой сами (gen_assets.py).

[env:smalltv_pro]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions/smalltv_pro_8mb.csv
extra_scripts = pre:gen_assets.py

lib_deps =
	moononournation/GFX Library for Arduino @ ^1.5.0

build_flags =
	-D CORE_DEBUG_LEVEL=0
